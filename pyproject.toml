[project]
name = "snappe-ai"
version = "0.1.0"
description = "The Universal WhatsApp Replier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.6",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "prometheus-client>=0.21,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
snappe = "snappe.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snappe"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/snappe"]
omit = ["src/snappe/main.py"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "PL", "RUF", "ASYNC", "PT", "T20", "DTZ", "ERA"]
per-file-ignores = { "tests/**/*.py" = ["PLR2004", "S101"] }

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.importlinter]
root_package = "snappe"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["snappe.interfaces", "snappe.adapters", "snappe.application", "snappe.domain"]

[[tool.importlinter.contracts]]
name = "Domain has no external framework dependencies"
type = "forbidden"
source_modules = ["snappe.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx"]

[dependency-groups]
dev = [
    "bandit>=1.8,<2.0",
    "httpx>=0.28,<1.0",
    "import-linter>=2.1,<3.0",
    "mypy>=1.13,<3.0",
    "pip-audit>=2.7,<3.0",
    "poethepoet>=0.31,<1.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format --check ."
typecheck = "mypy src"
imports = "lint-imports"
test = "pytest"
check = ["lint", "format", "typecheck", "imports", "test"]
