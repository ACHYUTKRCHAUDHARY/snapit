[project]
name = "snappe-ai"
version = "0.1.0"
description = "The Universal WhatsApp Replier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "prometheus-client>=0.21,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.1,<3.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
snappe = "snappe.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snappe"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.importlinter]
root_package = "snappe"

[[tool.importlinter.contracts]]
name = "Domain does not depend on adapters"
type = "forbidden"
source_modules = ["snappe.domain"]
forbidden_modules = ["snappe.adapters"]

[[tool.importlinter.contracts]]
name = "Application does not depend on adapters"
type = "forbidden"
source_modules = ["snappe.application"]
forbidden_modules = ["snappe.adapters"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
]
