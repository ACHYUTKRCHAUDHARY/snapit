name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - run: uv sync --locked
      - run: uv run poe check
      - run: uv run bandit -r src
      - run: uv run pip-audit
